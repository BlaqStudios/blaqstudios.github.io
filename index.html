<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaq Studios</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --btn-bg: #238636;
            --btn-hover: #2ea043;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 24px 0;
        }

        .game-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .game-card h2 {
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .game-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .play-btn {
            display: inline-block;
            background-color: var(--btn-bg);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .play-btn:hover {
            background-color: var(--btn-hover);
            text-decoration: none;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: text-decoration 0.2s;
        }

        .links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 28px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Blaq Studios</h1>
        <p class="subtitle">Indie Game Development Studio</p>

        <div class="game-card">
            <h2>Shikaku - Divide by Box</h2>
            <p>A minimalist spatial logic puzzle game designed to challenge deduction and grid-partitioning skills.</p>
            <a class="play-btn" href="https://play.google.com/store/apps/details?id=com.blaqstudios.shikaku" target="_blank" rel="noopener noreferrer">
                Get it on Google Play &rarr;
            </a>
        </div>

        <div class="divider"></div>

        <div class="links">
            <a href="/app-ads.txt">app-ads.txt</a>
            <a href="mailto:aaljinantony@gmail.com">Contact Support</a>
        </div>

        <footer>
            &copy; 2026 Blaq Studios. All rights reserved.
        </footer>
    </div>

</body>
</html>
